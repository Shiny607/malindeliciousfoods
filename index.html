<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>年節菜訂購單</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
:root{--bg:#eef0ea;--card:#fbfaf6;--ink:#1f2420;--mute:#66705f;--line:#d3d8cc;--red:#a82a1f;--onred:#fff;--gold:#8a6a22;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171b17;--card:#20261f;--ink:#ece9df;--mute:#a3ad9a;--line:#343c32;--red:#d9564a;--onred:#1a0d0b;--gold:#d2ad5a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171b17;--card:#20261f;--ink:#ece9df;--mute:#a3ad9a;--line:#343c32;--red:#d9564a;--onred:#1a0d0b;--gold:#d2ad5a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:720px;margin:0 auto;padding:28px 18px 120px}
h1,h2,.name,.price{font-family:"Noto Serif TC","Songti TC",serif}
h1{font-size:30px;margin:0;letter-spacing:.12em;border-right:6px solid var(--red);padding-right:14px;display:inline-block}
.sub{color:var(--mute);margin:10px 0 28px}
.item{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px;margin-bottom:14px;display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center}
.name{font-size:21px;font-weight:700}
.desc{color:var(--mute);font-size:14px;grid-column:1}
.price{color:var(--gold);font-size:19px;font-weight:700}
.price small{font-size:13px;font-weight:500;color:var(--mute)}
.qty{grid-row:1/4;grid-column:2;display:flex;align-items:center;gap:10px}
.qty button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:20px;cursor:pointer}
.qty button:hover{border-color:var(--red)}
.qty output{min-width:28px;text-align:center;font-weight:500;font-size:18px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--red);outline-offset:2px}
h2{font-size:20px;margin:34px 0 12px}
label{display:block;font-size:14px;color:var(--mute);margin-top:12px}
input,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.bar div{max-width:720px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px}
.total{font-family:"Noto Serif TC",serif;font-size:20px;font-weight:700}
.go{background:var(--red);color:var(--onred);border:0;border-radius:6px;padding:12px 24px;font:500 16px "Noto Sans TC",sans-serif;cursor:pointer}
.go:disabled{opacity:.4;cursor:not-allowed}
.sum{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px;white-space:pre-wrap;display:none;margin-top:18px}
.sum.on{display:block}
.pay{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px 18px;line-height:1.9}
.err{color:var(--red);font-size:14px;margin-top:8px;min-height:1.4em}
.copy{margin-top:12px;background:none;border:1px solid var(--red);color:var(--red);border-radius:6px;padding:8px 16px;font:inherit;cursor:pointer}
</style>
</head>
<body>
<main>
<h1>年節菜訂購單</h1>
<p class="sub">選擇品項與數量,填寫姓名後送出訂單。</p>

<div id="list"></div>

<h2>訂購資料</h2>
<label for="n">姓名</label><input id="n" autocomplete="name">

<h2>付款方式</h2>
<div class="pay"><strong>匯款</strong><br>永豐銀行(代號 807)<br>帳號:12101800719677</div>
<label for="z">匯款後五碼</label><input id="z" inputmode="numeric" maxlength="5" pattern="[0-9]*" autocomplete="off">
<div class="err" id="err" role="alert"></div>

<div class="sum" id="sum" aria-live="polite"></div>
</main>

<div class="bar"><div>
<span>合計 <span class="total" id="total">$0</span></span>
<button class="go" id="go" disabled>送出訂單</button>
</div></div>

<script>
var items=[
{id:"fo",name:"佛跳牆",price:1650,unit:"份",per:"",desc:"多種珍貴食材慢火燉煮,開封加熱即可享用。"},
{id:"rg",name:"肉羹",price:260,unit:"斤",per:"/斤",desc:"以斤計價,可依人數選購。"},
{id:"xo",name:"頂級干貝XO醬",price:900,unit:"瓶",per:"/450ml",desc:"干貝絲絲分明,每瓶450ml。"}
];
var q={};
var fmt=function(n){return "$"+n.toLocaleString("en-US")};
var list=document.getElementById("list");
items.forEach(function(it){
  q[it.id]=0;
  var d=document.createElement("div");d.className="item";
  d.innerHTML='<div class="name">'+it.name+'</div>'+
  '<div class="price">'+fmt(it.price)+' <small>'+it.per+'</small></div>'+
  '<div class="desc">'+it.desc+'</div>'+
  '<div class="qty"><button type="button" aria-label="減少'+it.name+'">−</button><output id="q-'+it.id+'">0</output><button type="button" aria-label="增加'+it.name+'">+</button></div>';
  var b=d.querySelectorAll("button");
  b[0].onclick=function(){if(q[it.id]>0){q[it.id]--;upd()}};
  b[1].onclick=function(){q[it.id]++;upd()};
  list.appendChild(d);
});
function total(){return items.reduce(function(s,it){return s+q[it.id]*it.price},0)}
function upd(){
  items.forEach(function(it){document.getElementById("q-"+it.id).textContent=q[it.id]});
  var t=total();
  document.getElementById("total").textContent=fmt(t);
  document.getElementById("go").disabled=t===0;
}
var CONFIG={
  // 填入表單服務的網址(例如 Formspree 給你的 https://formspree.io/f/xxxx),客人送出後訂單就會自動寄到你的信箱。
  // 留空的話,客人送出後會看到訂單明細,可複製或用 LINE 傳給你。
  endpoint:""
};
var text="";
var done=false;
document.getElementById("go").onclick=function(){
  var v=function(i){return document.getElementById(i).value.trim()};
  var err=document.getElementById("err");
  if(!v("n")){err.textContent="請填寫姓名。";return}
  err.textContent="";
  var lines=items.filter(function(it){return q[it.id]>0}).map(function(it){
    return it.name+" × "+q[it.id]+it.unit+"  "+fmt(q[it.id]*it.price)});
  text="【訂單】\n"+lines.join("\n")+"\n合計:"+fmt(total())+"\n\n姓名:"+v("n")+"\n付款方式:匯款(永豐銀行 807,帳號 12101800719677)\n匯款後五碼:"+(v("z")||"尚未填寫");
  var s=document.getElementById("sum");
  s.textContent="";
  var status=document.createElement("p");status.style.margin="0 0 10px";status.style.fontWeight="500";
  s.appendChild(status);
  s.appendChild(document.createTextNode(text));
  s.appendChild(document.createElement("br"));
  var c=document.createElement("button");c.className="copy";c.type="button";c.textContent="複製訂單";
  c.onclick=function(){
    try{navigator.clipboard.writeText(text).then(function(){c.textContent="已複製"},function(){c.textContent="請手動選取複製"})}
    catch(e){c.textContent="請手動選取複製"}
  };
  var l=document.createElement("a");l.className="copy";l.style.display="inline-block";l.style.marginLeft="8px";l.style.textDecoration="none";
  l.href="https://line.me/R/msg/text/?"+encodeURIComponent(text);l.target="_blank";l.rel="noopener";l.textContent="用 LINE 傳送";
  s.appendChild(c);s.appendChild(l);
  s.className="sum on";
  s.scrollIntoView({behavior:"smooth",block:"center"});
  if(CONFIG.endpoint){
    if(done){status.textContent="訂單已送出,請勿重複送出。";return}
    status.textContent="訂單送出中…";
    fetch(CONFIG.endpoint,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},
      body:JSON.stringify({"姓名":v("n"),"訂單內容":text,"合計":fmt(total()),"匯款後五碼":v("z")||"尚未填寫"})})
    .then(function(r){if(!r.ok)throw new Error("fail");done=true;status.textContent="訂單已送出,我們收到了。請依下方明細匯款。"})
    .catch(function(){status.textContent="訂單沒有成功送出,請按「複製訂單」或「用 LINE 傳送」,把明細傳給我們。"});
  }else{
    status.textContent="請複製下方訂單明細傳給我們,完成訂購。";
  }
};
</script>
</body>
</html>
